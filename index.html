<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galactic Astrogation Computer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Prevent status box squishing and allow panel scrolling */
    .panel.controls {
      overflow-y: auto !important;
    }
    
    #output-log {
      height: auto !important;
      min-height: 70px;
      max-height: none !important;
      overflow-y: visible !important;
      word-break: break-word;
      white-space: normal;
      flex-shrink: 0 !important; /* Locks size so it never gets squished */
    }
  </style>
</head>
<body>

  <div id="tooltip"></div>

  <div class="panel controls">
    <h2>Astrogation Systems</h2>
    <!-- AUREBESH TOGGLE SLIDER -->
    <div class="toggle-row" style="margin-bottom: 15px; border-bottom: 1px solid var(--grid-line); padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
    <span style="color: var(--accent);">Translate to Aurebesh</span>
    <label class="astrogation-switch">
      <input type="checkbox" id="font-toggle" onchange="toggleAurebesh(this)">
      <span class="slider round"></span>
  </label>
</div>
    <div class="control-group" id="log-system-group">
      <div class="collapsible-header" onclick="toggleLogSystem()">
        <span>Log System / Add Planet</span>
        <span class="arrow">&#9654;</span>
      </div>
      <div class="collapsible-content">
        <input type="text" id="p-name" placeholder="Designation (e.g., Geonosis)" />
        <div style="display: flex; gap: 10px;">
          <select id="p-x" style="flex: 1;" title="Grid Column (C-U)"></select>
          <select id="p-y" style="flex: 1;" title="Row (1-21)"></select>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="p-important" />
          <label for="p-important">Mark as Important System</label>
        </div>
        <button onclick="addPlanet()">Commit to NavDrive</button>
      </div>
    </div>

    <div class="control-group" id="plot-hyperlane-group">
      <div class="collapsible-header" onclick="togglePlotHyperlane()">
        <span>Manual Hyperlane Plotter</span>
        <span class="arrow">&#9654;</span>
      </div>
      <div class="collapsible-content">
        <div class="checkbox-row">
          <input type="checkbox" id="hp-click-mode" onchange="toggleClickPlotMode(this)" />
          <label for="hp-click-mode" style="color: var(--building); font-weight: bold;">Enable Click-to-Plot String Mode</label>
        </div>
        <div id="hp-status" style="font-size: 0.75em; color: #8b949e;">Status: Click-to-Plot Inactive</div>
        <input type="text" id="hp-name" placeholder="Hyperlane Name (e.g., Tapani Route)" />
        <input type="text" id="hp-sequence" placeholder="Planets (comma separated or click map)" />
        <div class="flex-row">
          <button onclick="clearCurrentBuilding()" style="background: #30363d; font-size: 0.75em;">Clear String</button>
          <button onclick="saveCustomHyperlane()" style="background: var(--building); color: #fff;">Commit Hyperlane</button>
        </div>
      </div>
    </div>

    <!-- UNIFIED ROUTE PLOTTER -->
    <div class="control-group">
      <label>Hyperspace Route Plotter</label>

      <div style="margin-top: 10px; font-size: 0.85em; color: #8b949e;">Add Waypoints, in order (2 or more):</div>
      <div class="autocomplete-container" style="margin-top: 5px;">
        <input type="text" id="route-waypoint-input" placeholder="Search system, click map, or press Enter..." autocomplete="off" />
        <div id="waypoint-suggestions" class="suggestions-list"></div>
      </div>
      <input type="text" id="route-sequence" placeholder="Waypoints will appear here..." readonly style="margin-top: 8px; color: var(--route);" />

      <hr style="border: none; border-top: 1px solid #30363d; margin: 15px 0;">
      <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
        <label style="flex: 1;">Hyperdrive Class:</label>
        <input type="number" id="h-class" value="1.0" step="0.1" min="0.1" style="flex: 1;" title="Lower is faster" />
      </div>

      <div class="flex-row">
        <button onclick="clearRouteSequence()" style="background: #30363d; font-size: 0.75em;">Clear Waypoints</button>
        <button onclick="calculateRoute()" style="flex: 1;">Calc Jump Route</button>
      </div>
    </div>

    <div class="output" id="output-log">
      > BOOT SEQUENCE INITIATED...<br>
      > NAVICOMPUTER READY...
    </div>

    <div class="control-group" id="memory-core-group" style="margin-top: auto;">
      <div class="collapsible-header" onclick="toggleMemoryCore()">
        <span>Memory Core Management</span>
        <span class="arrow">&#9654;</span>
      </div>
      <div class="collapsible-content">
        <button onclick="generateHyperlaneGrid()" style="margin-bottom: 8px; background: #238636;">Generate Hyperlane Grid</button>

        <div class="flex-row" style="margin-bottom: 5px;">
          <button onclick="exportData()">Export Planets</button>
          <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(event)" />
          <button onclick="document.getElementById('import-file').click()">Load Planets</button>
        </div>

        <div class="flex-row">
          <button onclick="exportHyperlanes()">Export Routes</button>
          <input type="file" id="import-h-file" accept=".json" style="display: none;" onchange="importHyperlanes(event)" />
          <button onclick="document.getElementById('import-h-file').click()">Load Routes</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel map-container">
    <h2>Galactic Grid</h2>
    <div class="map-viewport" id="map-viewport">
      <div class="grid" id="map-grid">
        <canvas id="route-canvas"></canvas>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
